# 编曲工作台 bundle patch：只把服务端入口插进 Harness 插件树。
# 业务面板由客户端通过 desktopWorkbenches.register() 注册；
# 这里不覆盖 Desktop 或其他插件的任何已有条目。
- insert:
    - id: bianqu-workbench        # 插件条目 id（仅用于在插件树里定位这一行）
      name: dsh-bianqu-workbench  # 必须写 npm 包名，Node 才能解析到安装的代码
      config:
        root: !!js dshHomePath('bianqu-workbench')   # 灵感库数据目录（DSH 数据目录下）
